name: release

# Publishes the package to npm through trusted publishing (DEC-6, BS-14).
on:
  push:
    tags:
      - 'scaffolder-backend-module-kadet-hub-v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          yarn install --immutable
      - run: yarn tsc
      - name: Pack
        working-directory: plugins/scaffolder-backend-module-kadet-hub
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "scaffolder-backend-module-kadet-hub-v$version" ]; then
            echo "::error::tag $TAG does not match version $version in package.json"
            exit 1
          fi
          yarn build
          yarn pack --out package.tgz
      - name: Publish
        working-directory: plugins/scaffolder-backend-module-kadet-hub
        run: |
          spec="$(jq -r .name package.json)@$(jq -r .version package.json)"
          # The first version is published by hand before its tag exists (BS-14).
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm"
            exit 0
          fi
          npm publish ./package.tgz
