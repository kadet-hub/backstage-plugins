name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:

permissions: {}

# Pins Renovate moves.
env:
  # renovate: datasource=github-release-attachments depName=rhysd/actionlint
  ACTIONLINT_VERSION: v1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
  ZIZMOR_VERSION: v1.31.1
  ZIZMOR_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99

jobs:
  # Type check, lint, format and tests. The tests read the live index and
  # the Sigstore trust root, so a GitHub or Sigstore outage fails them.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          corepack enable
          yarn install --immutable
      - run: yarn tsc
      - run: yarn lint
      - run: yarn prettier:check
      - run: yarn test

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -fsSLo actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tgz" | sha256sum -c --quiet
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSLo zizmor.tgz "https://github.com/zizmorcore/zizmor/releases/download/$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256  zizmor.tgz" | sha256sum -c --quiet
          tar -xzf zizmor.tgz zizmor
          ./zizmor --format plain .github

  # The one required check of the main ruleset.
  ci:
    needs: [test, workflows]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! grep -qwE 'failure|cancelled' <<<"$RESULTS"
